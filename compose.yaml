name: sanguosha
services:
  game:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    volumes:
      - game-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3930/api/auth/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${SGS_BIND_ADDRESS:-0.0.0.0}:${SGS_HTTP_PORT:-9527}:80"
    depends_on:
      game:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  game-data:
